name: Build Android APK (EletroNIC KMZ)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Minification Tools
        run: npm install -g html-minifier-terser

      - name: Install Cordova
        run: npm install -g cordova

      # --- DETECTOR DE VERSÃO ---
      - name: Detect Android Build Tools
        id: android_tools
        run: |
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -n 1)
          echo "Ferramentas encontradas: $BUILD_TOOLS_VERSION"
          echo "version=$BUILD_TOOLS_VERSION" >> $GITHUB_OUTPUT

      - name: Create Cordova App
        run: |
          cordova create app com.kmz.eletronic "EletroNIC"
          cd app
          # Versão fixada (não flutuante) - evita quebra silenciosa de build quando o
          # Cordova lança uma versão nova do cordova-android sem a gente saber.
          cordova platform add android@15.0.0

      - name: Add Cordova Plugins
        run: |
          cd app
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-file-opener2

      - name: Inject & Protect Source Code
        run: |
          echo "Preparando diretórios do Cordova..."
          rm app/www/index.html
          rm -f app/www/js/index.js app/www/css/index.css
          mkdir -p app/www/css app/www/js
          
          echo "Minificando e copiando folha de estilo (CSS)..."
          # O CSS agora é dividido em vários arquivos por seção (css/01-base.css,
          # css/02-forms-buttons.css, etc). O prefixo numérico garante a ordem correta
          # de concatenação antes de minificar - a ordem em CSS importa pra cascata.
          if compgen -G "css/*.css" > /dev/null; then
            cat css/*.css > combined_style.css
            html-minifier-terser --minify-css true -o app/www/css/styles.css combined_style.css
            rm -f combined_style.css
          elif [ -f "style.css" ]; then
            html-minifier-terser --minify-css true -o app/www/css/styles.css style.css
          elif [ -f "styles.css" ]; then
            html-minifier-terser --minify-css true -o app/www/css/styles.css styles.css
          else
            echo "⚠️ Arquivo CSS não encontrado, pulando minificação local..."
          fi
          
          echo "Processando e protegendo lógica de controle (JS)..."
          if [ -d "js" ]; then
            for f in js/*.js; do
              if [ -f "$f" ]; then
                filename=$(basename "$f")
                # Cria um envelope temporário de script para o html-minifier-terser processar o JS sem quebrar nos operadores lógicos
                echo "<script>" > temp_js.html
                cat "$f" >> temp_js.html
                echo "</script>" >> temp_js.html
                
                html-minifier-terser --minify-js true temp_js.html -o temp_js_min.html
                
                # Extrai de volta apenas o código JS estritamente minificado e limpo
                sed 's/<script>//g;s/<\/script>//g' temp_js_min.html > "app/www/js/$filename"
                rm -f temp_js.html temp_js_min.html
              fi
            done
          else
            echo "⚠️ Pasta /js não encontrada, copiando arquivos da raiz..."
            for f in *.js; do
              if [ -f "$f" ]; then
                cp "$f" "app/www/js/$f"
              fi
            done
          fi
          
          echo "Estruturando e limpando marcação HTML de entrada..."
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --output app/www/index.html \
            index.html
          
          echo "Configurando preferências visuais no config.xml..."
          sed -i '/<\/widget>/i \    <preference name="ShowSplashScreen" value="false" />' app/config.xml
          sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" />' app/config.xml
          sed -i '/<\/widget>/i \    <preference name="FadeSplashScreen" value="false" />' app/config.xml
          sed -i '/<\/widget>/i \    <preference name="BackgroundColor" value="0xff0a0c10" />' app/config.xml
          sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#0a0c10" />' app/config.xml
          
          if [ -f "icon.png" ]; then
            echo "Ícone personalizado encontrado! Configurando..."
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
            sed -i '/<\/widget>/i \    <splash src="www/icon.png" />' app/config.xml
            sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/icon.png" />' app/config.xml
          fi

          echo "Configurando ícone adaptativo (Android 8+)..."
          if [ -d "res/android" ] && [ -f "res/values/colors.xml" ]; then
            mkdir -p app/res/values app/res/android/mipmap-anydpi-v26
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "app/res/android/mipmap-$d"
              cp "res/android/mipmap-$d/ic_launcher_foreground.png" "app/res/android/mipmap-$d/ic_launcher_foreground.png"
              cp "res/android/mipmap-$d/ic_launcher.png" "app/res/android/mipmap-$d/ic_launcher.png"
              cp "res/android/mipmap-$d/ic_launcher_round.png" "app/res/android/mipmap-$d/ic_launcher_round.png"
            done
            cp res/values/colors.xml app/res/values/colors.xml
            cp res/android/mipmap-anydpi-v26/ic_launcher.xml app/res/android/mipmap-anydpi-v26/ic_launcher.xml
            cp res/android/mipmap-anydpi-v26/ic_launcher_round.xml app/res/android/mipmap-anydpi-v26/ic_launcher_round.xml

            # Abordagem manual via resource-file (não usa a tag <icon background/foreground>
            # do Cordova, que é conhecida por gerar builds quebrados em várias versões do
            # cordova-android - https://github.com/apache/cordova-android/issues/1616 e outros).
            sed -i '/<\/widget>/i \    <platform name="android">' app/config.xml
            sed -i '/<\/widget>/i \        <resource-file src="res/values/colors.xml" target="/app/src/main/res/values/colors.xml" />' app/config.xml
            sed -i '/<\/widget>/i \        <resource-file src="res/android/mipmap-anydpi-v26/ic_launcher.xml" target="/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" />' app/config.xml
            sed -i '/<\/widget>/i \        <resource-file src="res/android/mipmap-anydpi-v26/ic_launcher_round.xml" target="/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" />' app/config.xml
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              sed -i "/<\/widget>/i \\        <resource-file src=\"res/android/mipmap-$d/ic_launcher_foreground.png\" target=\"/app/src/main/res/mipmap-$d/ic_launcher_foreground.png\" />" app/config.xml
              sed -i "/<\/widget>/i \\        <resource-file src=\"res/android/mipmap-$d/ic_launcher.png\" target=\"/app/src/main/res/mipmap-$d/ic_launcher.png\" />" app/config.xml
              sed -i "/<\/widget>/i \\        <resource-file src=\"res/android/mipmap-$d/ic_launcher_round.png\" target=\"/app/src/main/res/mipmap-$d/ic_launcher_round.png\" />" app/config.xml
            done
            sed -i '/<\/widget>/i \        <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">' app/config.xml
            sed -i '/<\/widget>/i \            <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" />' app/config.xml
            sed -i '/<\/widget>/i \        <\/edit-config>' app/config.xml
            sed -i '/<\/widget>/i \    <\/platform>' app/config.xml
          else
            echo "⚠️ Arquivos de ícone adaptativo não encontrados, pulando..."
          fi

      - name: Build APK (Release Version)
        run: |
          cd app
          cordova build android --release -- --packageType=apk

      # --- ASSINATURA CORRIGIDA ---
      - name: Sign APK
        id: sign_app
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: app/platforms/android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          buildToolsVersion: ${{ steps.android_tools.outputs.version }}
        
      # Upload do APK - continua saindo pra instalar e testar direto no aparelho
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EletroNIC-KMZ-2026-Release
          path: ${{ steps.sign_app.outputs.signedFile }}

      # --- AAB (Android App Bundle) - formato exigido pela Play Store pra novas publicações ---
      # Não substitui o APK: os dois saem do mesmo build, o APK pra testar no aparelho, o
      # AAB pra quando for hora de enviar de verdade pra Play Store.
      - name: Build AAB (Release Version)
        run: |
          cd app
          cordova build android --release -- --packageType=bundle

      - name: Sign AAB
        id: sign_aab
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: app/platforms/android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          buildToolsVersion: ${{ steps.android_tools.outputs.version }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EletroNIC-KMZ-2026-Release-AAB
          path: ${{ steps.sign_aab.outputs.signedFile }}
